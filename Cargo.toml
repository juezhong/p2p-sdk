[package]
name = "p2p-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Direct-only P2P connectivity SDK (early development)"

[lib]
name = "p2p_sdk"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"] }
getrandom = "0.3"
if-addrs = "0.13"
netdev = { version = "=0.46.2", default-features = false, features = ["gateway"] }
quinn = "0.11"
is = "0.11.1"
hmac = "0.12"
sha2 = "0.10"
rustls = "0.23"
hkdf = "0.12"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["getrandom"] }

[dev-dependencies]
rcgen = "0.14"
