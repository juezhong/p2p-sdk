[package]
name = "p2p-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-2.0-only"
description = "Direct-only P2P connectivity SDK (early development)"

[lib]
name = "p2p_sdk"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"] }
getrandom = "0.3"
quinn = "0.11"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
