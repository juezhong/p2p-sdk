name: SDK debug binaries (five platforms)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/debug.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/debug.yml"

permissions:
  contents: read

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: p2p-sdk-debug-windows-x86_64
            executable: p2p-sdk-debug.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: p2p-sdk-debug-macos-x86_64
            executable: p2p-sdk-debug
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: p2p-sdk-debug-macos-aarch64
            executable: p2p-sdk-debug
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: p2p-sdk-debug-linux-x86_64
            executable: p2p-sdk-debug
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: p2p-sdk-debug-linux-aarch64
            executable: p2p-sdk-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native debug binary
        run: cargo build --bin p2p-sdk-debug --target ${{ matrix.target }}
      - name: Run same-host ICE and dual QUIC TLS selftest
        run: cargo run --bin p2p-sdk-debug --target ${{ matrix.target }} -- selftest
      - name: Upload debug executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/debug/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14
