name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reuse downloaded Cargo source packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            sdk-source-${{ runner.os }}-${{ runner.arch }}-
      - name: 自动格式化 Rust 源码
        run: cargo fmt --all
      - name: 检查格式化后的结果
        run: |
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --all-targets

  native-matrix:
    name: SDK native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse downloaded Cargo source packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            sdk-source-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile and test SDK on native OS / CPU
        run: cargo test --all-targets
      # 多 UDP socket QUIC 竞速在 Apple Silicon 曾偶发失败。
      # 重复运行真实连接/释放测试，不禁用测试、不延长程序超时。
      - name: Stress multi-owner QUIC race and socket release (macOS ARM64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          for run in 1 2 3 4 5 6 7 8; do
            echo "QUIC race / socket-release stress iteration ${run}/8"
            cargo test --lib direct_peer::tests::quic_path_race_shutdown_releases_all_advertised_udp_ports -- --exact
          done

  musl:
    name: SDK static musl compile (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl native compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Reuse downloaded Cargo source packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            sdk-source-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile SDK dependency graph for static musl
        run: cargo build --target ${{ matrix.target }}
